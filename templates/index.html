<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Programming Tutor</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
<style>
body{background:#0f172a;color:white;font-family:Segoe UI;}
.navbar{margin-bottom:20px;}
.chat-container{height:60vh;overflow-y:auto;padding:15px;border-radius:10px;background:#020617;}
.message{padding:10px;margin-bottom:10px;border-radius:10px;max-width:80%;}
.user{background:#2563eb;margin-left:auto;}
.assistant{background:#1e293b;}
textarea,select{background:#020617 !important;color:white !important;border:none !important;}
#editor{height:300px;border-radius:8px;}
.output-box{background:black;padding:10px;min-height:100px;border-radius:8px;}
</style>
</head>
<body>
<div class="container py-4">

<!-- NAVIGATION -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark rounded mb-3">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">AI Tutor</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/">Chat</a></li>
        <li class="nav-item"><a class="nav-link" href="/history">History</a></li>
        <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
        <li class="nav-item"><a class="nav-link" href="/settings">Settings</a></li>
      </ul>
    </div>
  </div>
</nav>

<h2 class="text-center mb-3">🤖 SkillTutor</h2>

<select id="mode" class="form-select mb-3"></select>

<div id="chat" class="chat-container mb-3"></div>

<div class="input-group mb-4">
<textarea id="message" class="form-control" placeholder="Ask something..."></textarea>
<button id="sendBtn" class="btn btn-primary">Send</button>
</div>

<hr>
<h5>💻 PixelScript</h5>
<div id="editor"></div>
<button id="runBtn" class="btn btn-success mt-2">Run Code</button>
<h5 class="mt-3">🖥 Output</h5>
<pre id="output" class="output-box"></pre>
</div>

<script>
// ---------- Modes & Monaco language mapping ----------
const modeSelect = document.getElementById("mode");
const modes = ["python","java","c","c++","web","error","mongodb"];
const languageMap = {
    "python": "python",
    "java": "java",
    "c": "c",
    "c++": "cpp",
    "web": "html",
    "error": "plaintext",
    "mongodb": "json"
};

// Populate select options
modes.forEach(m=>{
    let opt=document.createElement("option");
    opt.value=m;
    opt.innerText=m;
    modeSelect.appendChild(opt);
});

// Load default mode from localStorage
modeSelect.value = localStorage.getItem("defaultMode") || "python";

// ---------- Monaco Editor ----------
var editor;
require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
require(['vs/editor/editor.main'], function () {
    editor = monaco.editor.create(document.getElementById('editor'), {
        value: `print("Hello Student!")`,
        language: languageMap[modeSelect.value],
        theme: "vs-dark",
        automaticLayout: true
    });
});

// Change editor language when mode changes
modeSelect.addEventListener("change", ()=>{
    const lang = languageMap[modeSelect.value];
    monaco.editor.setModelLanguage(editor.getModel(), lang);
    localStorage.setItem("defaultMode", modeSelect.value);
    // Reset editor content for new mode
    const starterCode = {
        "python": `print("Hello Student!")`,
        "java": `public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello Student!");\n    }\n}`,
        "c": `#include <stdio.h>\nint main() {\n    printf("Hello Student!\\n");\n    return 0;\n}`,
        "c++": `#include <iostream>\nusing namespace std;\nint main() {\n    cout << "Hello Student!" << endl;\n    return 0;\n}`,
        "web": `<!DOCTYPE html>\n<html>\n<body>\nHello Student!\n</body>\n</html>`,
        "error": "",
        "mongodb": `{\n    "message": "Hello Student!"\n}`
    };
    editor.setValue(starterCode[modeSelect.value] || "");
});

// ---------- Chat ----------
const chatBox = document.getElementById("chat");
const sendBtn = document.getElementById("sendBtn");

function addMessage(role,text){
    let div=document.createElement("div");
    div.classList.add("message",role);
    div.innerText=text;
    chatBox.appendChild(div);
    chatBox.scrollTop=chatBox.scrollHeight;
}

function typingAnimation(){
    let div=document.createElement("div");
    div.classList.add("message","assistant");
    div.id="typing";
    div.innerText="Typing...";
    chatBox.appendChild(div);
    chatBox.scrollTop=chatBox.scrollHeight;
}

function removeTyping(){
    let t=document.getElementById("typing");
    if(t) t.remove();
}

function sendMessage(){
    let message=document.getElementById("message").value;
    let mode = modeSelect.value;
    if(!message) return;
    addMessage("user",message);
    typingAnimation();
    fetch("/chat",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({message:message,mode:mode})
    }).then(res=>res.json()).then(data=>{
        removeTyping();
        addMessage("assistant",data.reply);
    });
    document.getElementById("message").value="";
}

sendBtn.addEventListener("click", sendMessage);

// ---------- Run Code ----------
const runBtn = document.getElementById("runBtn");
function runCode(){
    let code = editor.getValue();
    let mode = modeSelect.value;
    fetch("/run_code",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({code:code, mode:mode})
    }).then(res=>res.json()).then(data=>{
        document.getElementById("output").innerText = data.output || data.error;
    });
}
runBtn.addEventListener("click", runCode);
</script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
