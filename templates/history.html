<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat History</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#0f172a;color:white;font-family:Segoe UI;}
.navbar{margin-bottom:20px;}
.list-group-item{background:#1e293b;color:white;margin-bottom:5px;}
a{color:white;}
</style>
</head>
<body>
<div class="container py-4">

<!-- NAVIGATION -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark rounded mb-3">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">AI Tutor</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/">Chat</a></li>
        <li class="nav-item"><a class="nav-link active" href="/history">History</a></li>
        <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
        <li class="nav-item"><a class="nav-link" href="/settings">Settings</a></li>
      </ul>
    </div>
  </div>
</nav>

<h2>Chat History</h2>
<div class="list-group mb-3">
    {% for msg in messages %}
    <div class="list-group-item">
        <strong>{{ msg.role.capitalize() }} [{{ msg.mode }}]:</strong> {{ msg.content }}
    </div>
    {% endfor %}
</div>

<a href="/clear_history" class="btn btn-danger">Clear History</a>
<a href="/" class="btn btn-primary ms-2">Back to Chat</a>

</div>
</body>
</html>
