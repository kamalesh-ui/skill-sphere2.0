<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Settings</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#0f172a;color:white;font-family:Segoe UI;}
.navbar{margin-bottom:20px;}
select, button{background:#020617 !important;color:white !important;}
</style>
</head>
<body>
<div class="container py-4">

<!-- NAVIGATION -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark rounded mb-3">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">AI Tutor</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/">Chat</a></li>
        <li class="nav-item"><a class="nav-link" href="/history">History</a></li>
        <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
        <li class="nav-item"><a class="nav-link active" href="/settings">Settings</a></li>
      </ul>
    </div>
  </div>
</nav>

<h2>Settings</h2>
<p>Configure your default tutor mode.</p>
<form id="settingsForm">
    <div class="mb-3">
        <label for="defaultMode" class="form-label">Default Tutor Mode</label>
        <select id="defaultMode" class="form-select">
            <option value="python">Python</option>
            <option value="web">Web Development</option>
            <option value="java">Java</option>
            <option value="error">Debugging</option>
            <option value="c">C</option>
            <option value="c++">C++</option>
            <option value="mongodb">MongoDB</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Save Settings</button>
</form>

<a href="/" class="btn btn-secondary mt-3">Back to Chat</a>

<script>
// Load current default mode
const defaultSelect = document.getElementById("defaultMode");
defaultSelect.value = localStorage.getItem("defaultMode") || "python";

// Save on submit
document.getElementById("settingsForm").addEventListener("submit", function(e){
    e.preventDefault();
    localStorage.setItem("defaultMode", defaultSelect.value);
    alert("Default mode saved!");
});
</script>

</div>
</body>
</html>
